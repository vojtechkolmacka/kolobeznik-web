<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koloběžník — Kompletní Administrace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #1C1F1A; color: #F0ECE1; }
    .heading-font { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: -0.01em; }
    .lime-bg { background-color: #C6F135; }
    .lime-btn { background-color: #C6F135; color: #111827; font-family: 'Oswald', sans-serif; letter-spacing: 0.05em; }
    .lime-btn:hover { background-color: #b3df22; }
    .admin-tab.active { background-color: #C6F135; color: #000; }
  </style>
</head>
<body class="p-4 sm:p-8 max-w-xl mx-auto min-h-screen flex flex-col justify-between">
  <div>
    <div class="flex items-center justify-between mb-6 border-b border-stone-800 pb-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl lime-bg flex items-center justify-center text-black font-black text-xl">⚡</div>
        <div>
          <span class="text-[10px] uppercase font-bold text-lime-400 tracking-widest block">MASTER ADMIN</span>
          <h1 class="heading-font text-2xl text-white">SPRÁVA A FOTKY</h1>
        </div>
      </div>
      <a href="./index.html" class="text-xs text-stone-400 hover:text-white underline">Zpět na web &rarr;</a>
    </div>

    <!-- Připojení -->
    <div class="bg-stone-900 border border-stone-800 rounded-3xl p-5 mb-6 shadow-xl space-y-3">
      <h2 class="heading-font text-base text-white">GitHub Připojení</h2>
      <div class="space-y-2 text-xs">
        <input type="password" id="admin-token" placeholder="GitHub Token (PAT)" class="w-full bg-stone-950 border border-stone-800 rounded-xl p-2.5 text-white font-mono">
        <input type="text" id="admin-repo" value="vojtechkolmacka/kolobeznik-web" class="w-full bg-stone-950 border border-stone-800 rounded-xl p-2.5 text-white font-mono">
        <button onclick="saveSettings()" class="lime-btn w-full py-2.5 rounded-xl font-bold uppercase text-xs">Uložit připojení</button>
      </div>
    </div>

    <!-- Přepínání záložek adminu -->
    <div class="flex gap-1.5 mb-6 overflow-x-auto pb-1">
      <button onclick="switchTab('scooters')" id="tab-scooters" class="admin-tab active py-2 px-3 rounded-xl text-xs font-bold uppercase heading-font bg-stone-800 text-stone-300 whitespace-nowrap">Koloběžka</button>
      <button onclick="switchTab('tips')" id="tab-tips" class="admin-tab py-2 px-3 rounded-xl text-xs font-bold uppercase heading-font bg-stone-800 text-stone-300 whitespace-nowrap">Tip / Článek</button>
      <button onclick="switchTab('sections')" id="tab-sections" class="admin-tab py-2 px-3 rounded-xl text-xs font-bold uppercase heading-font bg-stone-800 text-stone-300 whitespace-nowrap">➕ Rubrika</button>
    </div>

    <!-- SEKCE 1: KOLOBĚŽKA -->
    <div id="sec-scooters" class="space-y-6">
      <div class="bg-stone-900 border border-stone-800 rounded-3xl p-6 shadow-xl space-y-4">
        <h2 class="heading-font text-lg text-white">Přidat novou koloběžku</h2>
        <div class="space-y-3 text-xs">
          <input type="text" id="s-name" placeholder="Název stroje" class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white">
          <div class="grid grid-cols-2 gap-2">
            <select id="s-cat" class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white">
              <option value="folding">Skládací</option>
              <option value="sport">Sportovní</option>
              <option value="electric">Elektro</option>
              <option value="special">Speciály</option>
            </select>
            <select id="s-verdict" class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white">
              <option value="Doporučuji">Doporučuji</option>
              <option value="Nedoporučuji">Nedoporučuji</option>
              <option value="Bestie">⚡ Bestie</option>
            </select>
          </div>
          <textarea id="s-blurb" rows="2" placeholder="Krátký popis..." class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white"></textarea>
          <input type="text" id="s-pros" placeholder="Klady (čárkou)" class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white">
          <input type="text" id="s-cons" placeholder="Zápory (čárkou)" class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white">
          
          <!-- Nahrání fotky pro koloběžku -->
          <div class="bg-stone-950 p-3 rounded-xl border border-stone-800 space-y-2">
            <label class="block font-bold text-stone-300">Fotka koloběžky:</label>
            <input type="file" id="s-img-file" accept="image/*" class="w-full text-white file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-[#C6F135] file:text-black">
            <input type="text" id="s-img" value="./public/images/hero.jpg" placeholder="./public/images/foto.jpg" class="w-full bg-stone-900 border border-stone-800 rounded-lg p-2 text-white font-mono text-[11px]">
          </div>

          <button onclick="addScooter()" class="lime-btn w-full py-3 rounded-xl font-bold uppercase text-xs shadow">Přidat koloběžku</button>
        </div>
      </div>
    </div>

    <!-- SEKCE 2: TIP / ČLÁNEK -->
    <div id="sec-tips" class="space-y-6 hidden">
      <div class="bg-stone-900 border border-stone-800 rounded-3xl p-6 shadow-xl space-y-4">
        <h2 class="heading-font text-lg text-white">Přidat článek do Tipech</h2>
        <div class="space-y-3 text-xs">
          <input type="text" id="t-title" placeholder="Název článku" class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white">
          <input type="text" id="t-cat" placeholder="Štítek (např. VÝBAVA)" class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white">
          <textarea id="t-perex" rows="2" placeholder="Perex..." class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white"></textarea>
          <textarea id="t-text" rows="4" placeholder="Plný text..." class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white"></textarea>
          
          <!-- Nahrání fotky pro tip -->
          <div class="bg-stone-950 p-3 rounded-xl border border-stone-800 space-y-2">
            <label class="block font-bold text-stone-300">Fotka k článku:</label>
            <input type="file" id="t-img-file" accept="image/*" class="w-full text-white file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-[#C6F135] file:text-black">
            <input type="text" id="t-img" value="./public/images/hero.jpg" placeholder="./public/images/tip.jpg" class="w-full bg-stone-900 border border-stone-800 rounded-lg p-2 text-white font-mono text-[11px]">
          </div>

          <button onclick="addTip()" class="lime-btn w-full py-3 rounded-xl font-bold uppercase text-xs shadow">Přidat článek</button>
        </div>
      </div>
    </div>

    <!-- SEKCE 3: NOVÁ RUBRIKA -->
    <div id="sec-sections" class="space-y-6 hidden">
      <div class="bg-stone-900 border border-stone-800 rounded-3xl p-6 shadow-xl space-y-4">
        <h2 class="heading-font text-lg text-white">Vytvořit novou rubriku / záložku</h2>
        <p class="text-xs text-stone-400">Automaticky přidá nové tlačítko do horního menu webu a vytvoří pro něj prázdnou stránku.</p>
        <div class="space-y-3 text-xs">
          <input type="text" id="sec-name" placeholder="Název rubriky (např. Servis)" class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white">
          <input type="text" id="sec-id" placeholder="ID bez mezer (např. servis)" class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white font-mono">
          <button onclick="addNewSection()" class="lime-btn w-full py-3 rounded-xl font-bold uppercase text-xs">Vytvořit novou rubriku</button>
        </div>
      </div>
    </div>

    <p id="global-status" class="text-center font-bold text-lime-400 my-4 text-xs"></p>
  </div>

  <footer class="text-center text-xs text-stone-600 pt-8">Koloběžník Admin &copy; 2026</footer>

  <script>
    document.getElementById('admin-token').value = localStorage.getItem('kol_token') || '';
    document.getElementById('admin-repo').value = localStorage.getItem('kol_repo') || 'vojtechkolmacka/kolobeznik-web';

    function saveSettings() {
      localStorage.setItem('kol_token', document.getElementById('admin-token').value);
      localStorage.setItem('kol_repo', document.getElementById('admin-repo').value);
      alert('Uloženo!');
    }

    function switchTab(tab) {
      ['scooters', 'tips', 'sections'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.remove('active');
        document.getElementById(`sec-${t}`).classList.add('hidden');
      });
      document.getElementById(`tab-${tab}`).classList.add('active');
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
    }

    // Okamžité nahrání fotky při výběru u koloběžky
    document.getElementById('s-img-file').addEventListener('change', async (e) => {
      if (e.target.files.length > 0) {
        const file = e.target.files[0];
        const filename = file.name.toLowerCase().replace(/\s+/g, '-');
        document.getElementById('s-img').value = `./public/images/${filename}`;
        await uploadFileDirectly(file, filename, 'Obrázek koloběžky nahrán!');
      }
    });

    // Okamžité nahrání fotky při výběru u tipu
    document.getElementById('t-img-file').addEventListener('change', async (e) => {
      if (e.target.files.length > 0) {
        const file = e.target.files[0];
        const filename = file.name.toLowerCase().replace(/\s+/g, '-');
        document.getElementById('t-img').value = `./public/images/${filename}`;
        await uploadFileDirectly(file, filename, 'Obrázek k článku nahrán!');
      }
    });

    async function uploadFileDirectly(file, filename, successMsg) {
      const token = localStorage.getItem('kol_token'), repo = localStorage.getItem('kol_repo'), status = document.getElementById('global-status');
      if (!token || !repo) { alert('Vyplň token nahoře!'); return; }

      status.innerText = 'Nahrávám fotku na GitHub...';
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = async function() {
        const base64 = reader.result.split(',')[1];
        const path = `public/images/${filename}`;
        const url = `https://api.github.com/repos/${repo}/contents/${path}`;

        let sha = null;
        const check = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
        if (check.ok) sha = (await check.json()).sha;

        const body = { message: `Admin: Nahrána fotka ${filename}`, content: base64 };
        if (sha) body.sha = sha;

        const put = await fetch(url, {
          method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (put.ok) status.innerText = successMsg;
        else status.innerText = 'Chyba při nahrávání fotky.';
      };
    }

    async function addScooter() {
      const token = localStorage.getItem('kol_token'), repo = localStorage.getItem('kol_repo'), status = document.getElementById('global-status');
      if (!token || !repo) { alert('Vyplň připojení nahoře!'); return; }

      const name = document.getElementById('s-name').value.trim();
      const cat = document.getElementById('s-cat').value;
      const verdict = document.getElementById('s-verdict').value;
      const blurb = document.getElementById('s-blurb').value.trim();
      const pros = document.getElementById('s-pros').value.split(',').map(x => x.trim()).filter(Boolean);
      const cons = document.getElementById('s-cons').value.split(',').map(x => x.trim()).filter(Boolean);
      const img = document.getElementById('s-img').value.trim();

      if (!name || !blurb) { alert('Vyplň název a popis.'); return; }
      status.innerText = 'Odesílám koloběžku...';

      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/index.html`, { headers: { 'Authorization': `token ${token}` } });
        if (!res.ok) throw new Error('Chyba čtení index.html');
        const fileData = await res.json();
        const htmlContent = new TextDecoder().decode(Uint8Array.from(atob(fileData.content), c => c.codePointAt(0)));

        let catLabel = cat === 'sport' ? 'SPORTOVNÍ' : cat === 'electric' ? 'ELEKTRICKÉ' : cat === 'special' ? 'SPECIÁLY' : 'SKLÁDACÍ';
        const newItemStr = `      { id: ${Date.now()}, name: "${name}", cat: "${cat}", catLabel: "${catLabel}", verdict: "${verdict}", img: "${img}", blurb: "${blurb}", pros: ${JSON.stringify(pros)}, cons: ${JSON.stringify(cons)}, specs: ["Zátěžový test"] },\n`;

        const marker = "const scooters = [";
        const startIdx = htmlContent.indexOf(marker);
        if (startIdx === -1) throw new Error('Nenalezeno pole koloběžek');

        const insertPos = startIdx + marker.length;
        const updatedHtml = htmlContent.slice(0, insertPos) + "\n" + newItemStr + htmlContent.slice(insertPos);

        const put = await fetch(`https://api.github.com/repos/${repo}/contents/index.html`, {
          method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `Admin: Přidána koloběžka ${name}`, content: btoa(unescape(encodeURIComponent(updatedHtml))), sha: fileData.sha })
        });

        if (put.ok) { status.innerText = 'Koloběžka úspěšně přidána!'; document.getElementById('s-name').value = ''; document.getElementById('s-blurb').value = ''; }
        else { status.innerText = 'Chyba ukládání.'; }
      } catch (err) { status.innerText = 'Chyba: ' + err.message; }
    }

    async function addTip() {
      const token = localStorage.getItem('kol_token'), repo = localStorage.getItem('kol_repo'), status = document.getElementById('global-status');
      if (!token || !repo) { alert('Vyplň připojení nahoře!'); return; }

      const title = document.getElementById('t-title').value.trim();
      const category = document.getElementById('t-cat').value.trim().toUpperCase();
      const perex = document.getElementById('t-perex').value.trim();
      const text = document.getElementById('t-text').value.trim();
      const img = document.getElementById('t-img').value.trim();

      if (!title || !text) { alert('Vyplň název a text.'); return; }
      status.innerText = 'Odesílám tip...';

      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/index.html`, { headers: { 'Authorization': `token ${token}` } });
        if (!res.ok) throw new Error('Chyba čtení index.html');
        const fileData = await res.json();
        const htmlContent = new TextDecoder().decode(Uint8Array.from(atob(fileData.content), c => c.codePointAt(0)));

        const newItemStr = `      { id: ${Date.now()}, title: "${title}", category: "${category}", img: "${img}", perex: "${perex}", text: \`${text}\` },\n`;

        const marker = "const tipsData = [";
        const startIdx = htmlContent.indexOf(marker);
        if (startIdx === -1) throw new Error('Nenalezeno pole tipů');

        const insertPos = startIdx + marker.length;
        const updatedHtml = htmlContent.slice(0, insertPos) + "\n" + newItemStr + htmlContent.slice(insertPos);

        const put = await fetch(`https://api.github.com/repos/${repo}/contents/index.html`, {
          method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `Admin: Přidán tip ${title}`, content: btoa(unescape(encodeURIComponent(updatedHtml))), sha: fileData.sha })
        });

        if (put.ok) { status.innerText = 'Tip úspěšně přidán!'; document.getElementById('t-title').value = ''; document.getElementById('t-text').value = ''; }
        else { status.innerText = 'Chyba ukládání.'; }
      } catch (err) { status.innerText = 'Chyba: ' + err.message; }
    }

    async function addNewSection() {
      const token = localStorage.getItem('kol_token'), repo = localStorage.getItem('kol_repo'), status = document.getElementById('global-status');
      const name = document.getElementById('sec-name').value.trim();
      const id = document.getElementById('sec-id').value.trim().toLowerCase();

      if (!token || !repo) { alert('Vyplň připojení nahoře!'); return; }
      if (!name || !id) { alert('Vyplň název i ID rubriky.'); return; }

      status.innerText = 'Vytvářím novou rubriku na webu...';

      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/index.html`, { headers: { 'Authorization': `token ${token}` } });
        if (!res.ok) throw new Error('Chyba čtení index.html');
        const fileData = await res.json();
        const htmlContent = new TextDecoder().decode(Uint8Array.from(atob(fileData.content), c => c.codePointAt(0)));

        const navMarker = '<button onclick="navigateTo(\'kontakt\')"';
        const newNavBtn = `<button onclick="navigateTo('${id}')" class="nav-link hover:text-[#C6F135] transition" data-target="${id}">${name}</button>\n        ` + navMarker;
        
        const pageMarker = '<!-- ==================== KONTAKT ==================== -->';
        const newPageDiv = `<!-- ==================== ${name.toUpperCase()} ==================== -->\n    <div id="page-${id}" class="page-view py-14 px-5 max-w-xl mx-auto">\n      <div class="bg-white rounded-3xl p-6 border border-stone-300 shadow-sm space-y-4">\n        <h2 class="heading-font text-3xl font-bold text-stone-950">${name}</h2>\n        <p class="text-stone-700 text-sm">Zde budou články a obsah pro rubriku ${name}.</p>\n      </div>\n    </div>\n\n    ` + pageMarker;

        const updatedHtml = htmlContent.replace(navMarker, newNavBtn).replace(pageMarker, newPageDiv);

        const put = await fetch(`https://api.github.com/repos/${repo}/contents/index.html`, {
          method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `Admin: Vytvořena nová rubrika ${name}`, content: btoa(unescape(encodeURIComponent(updatedHtml))), sha: fileData.sha })
        });

        if (put.ok) {
          status.innerText = `Rubrika "${name}" byla úspěšně vytvořena!`;
          document.getElementById('sec-name').value = '';
          document.getElementById('sec-id').value = '';
        } else {
          status.innerText = 'Chyba při vytváření rubriky.';
        }
      } catch (err) {
        status.innerText = 'Chyba: ' + err.message;
      }
    }
  </script>
</body>
</html>
