<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koloběžník — Administrace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #1C1F1A; color: #F0ECE1; }
    .heading-font { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: -0.01em; }
    .lime-bg { background-color: #C6F135; }
    .lime-btn { background-color: #C6F135; color: #111827; font-family: 'Oswald', sans-serif; letter-spacing: 0.05em; }
    .lime-btn:hover { background-color: #b3df22; }
  </style>
</head>
<body class="p-4 sm:p-8 max-w-xl mx-auto min-h-screen flex flex-col justify-between">
  <div>
    <div class="flex items-center justify-between mb-6 border-b border-stone-800 pb-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl lime-bg flex items-center justify-center text-black font-black text-xl">⚙️</div>
        <div>
          <span class="text-[10px] uppercase font-bold text-lime-400 tracking-widest block">INTERNÍ APP</span>
          <h1 class="heading-font text-2xl text-white">KOLOBĚŽNÍK ADMIN</h1>
        </div>
      </div>
      <a href="./index.html" class="text-xs text-stone-400 hover:text-white underline">Zpět na web &rarr;</a>
    </div>

    <!-- Nastavení GitHub Tokenu -->
    <div class="bg-stone-900 border border-stone-800 rounded-3xl p-6 mb-6 shadow-xl space-y-4">
      <h2 class="heading-font text-lg text-white">1. Připojení k GitHubu</h2>
      <p class="text-xs text-stone-400 leading-relaxed">
        Zadej svůj GitHub token (PAT) s oprávněním <code>repo</code>. Údaje se ukládají pouze do paměti tvého telefonu.
      </p>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold mb-1 text-stone-300">GitHub Token:</label>
          <input type="password" id="admin-token" placeholder="ghp_..." class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white font-mono">
        </div>
        <div>
          <label class="block font-bold mb-1 text-stone-300">Repozitář:</label>
          <input type="text" id="admin-repo" value="vojtechkolmacka/kolobeznik-web" class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white font-mono">
        </div>
        <button onclick="saveSettings()" class="lime-btn w-full py-3 rounded-xl font-bold uppercase text-xs">Uložit údaje v zařízení</button>
      </div>
    </div>

    <!-- Přidání poznámky / souboru -->
    <div class="bg-stone-900 border border-stone-800 rounded-3xl p-6 shadow-xl space-y-4">
      <h2 class="heading-font text-lg text-white">2. Rychlý zápis poznámky</h2>
      <p class="text-xs text-stone-400">Vytvoří nový textový soubor ve složce repozitáře.</p>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold mb-1 text-stone-300">Název souboru (např. clanek.txt):</label>
          <input type="text" id="file-name" placeholder="zapis.txt" class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white font-mono">
        </div>
        <div>
          <label class="block font-bold mb-1 text-stone-300">Obsah:</label>
          <textarea id="file-content" rows="4" placeholder="Sem napiš text..." class="w-full bg-stone-950 border border-stone-800 rounded-xl p-3 text-white"></textarea>
        </div>
        <button onclick="pushToGitHub()" class="bg-white text-stone-950 w-full py-3 rounded-xl font-bold uppercase text-xs hover:bg-stone-200 transition">Odeslat na GitHub</button>
        <p id="status-msg" class="text-center font-bold text-lime-400 mt-2"></p>
      </div>
    </div>
  </div>

  <footer class="text-center text-xs text-stone-600 pt-8">
    Koloběžník Admin PWA &copy; 2026
  </footer>

  <script>
    document.getElementById('admin-token').value = localStorage.getItem('kol_token') || '';
    document.getElementById('admin-repo').value = localStorage.getItem('kol_repo') || 'vojtechkolmacka/kolobeznik-web';

    function saveSettings() {
      localStorage.setItem('kol_token', document.getElementById('admin-token').value);
      localStorage.setItem('kol_repo', document.getElementById('admin-repo').value);
      alert('Nastavení uloženo v paměti telefonu!');
    }

    async function pushToGitHub() {
      const token = localStorage.getItem('kol_token');
      const repo = localStorage.getItem('kol_repo');
      const filename = document.getElementById('file-name').value.trim();
      const content = document.getElementById('file-content').value;
      const statusEl = document.getElementById('status-msg');

      if (!token || !repo) {
        alert('Nejprve vyplň a ulož GitHub token nahoře!');
        return;
      }
      if (!filename || !content) {
        alert('Vyplň název souboru i obsah.');
        return;
      }

      statusEl.innerText = 'Odesílám požadavek na GitHub...';

      // GitHub API vyžaduje obsah zakódovaný v Base64
      const encodedContent = btoa(unescape(encodeURIComponent(content)));
      const url = `https://api.github.com/repos/${repo}/contents/${filename}`;

      try {
        // Nejprve zkontrolujeme, jestli soubor už existuje (kvůli SHA)
        let sha = null;
        const checkRes = await fetch(url, {
          headers: { 'Authorization': `token ${token}` }
        });
        if (checkRes.ok) {
          const fileData = await checkRes.json();
          sha = fileData.sha;
        }

        // Odeslání nového obsahu
        const bodyData = {
          message: `Admin PWA: Automatický zápis ${filename}`,
          content: encodedContent
        };
        if (sha) bodyData.sha = sha; // Pokud soubor existuje, musíme poslat jeho SHA

        const response = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(bodyData)
        });

        if (response.ok) {
          statusEl.innerText = 'Úspěšně uloženo na GitHub! Web se za chvíli aktualizuje.';
        } else {
          const err = await response.json();
          statusEl.innerText = 'Chyba: ' + (err.message || 'Nepodařilo se uložit.');
        }
      } catch (error) {
        statusEl.innerText = 'Chyba připojení: ' + error.message;
      }
    }
  </script>
</body>
</html>
